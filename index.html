<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessica & Andre | Wedding Invitation & RSVP</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d4af37; --cream: #faf6f0; --deep: #1a2a3a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; background: linear-gradient(180deg, #87ceeb 0%, #f4a261 40%, #e76f51 70%, #2a9d8f 100%); min-height: 100vh; color: var(--deep); }
  .invite-container { max-width: 480px; margin: 20px auto; background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; border: 1px solid rgba(212,175,55,0.4); }
  .invitation-img { width: 100%; display: block; }
  .rsvp-section { background: rgba(255,255,255,0.95); margin: 0; padding: 25px; }
  h2 { font-family: 'Playfair Display', serif; text-align: center; color: var(--gold); margin-bottom: 15px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; }
  input, select { width: 100%; padding: 12px; border: 1px solid #e0d0b0; border-radius: 8px; font-size: 15px; }
  button { width: 100%; margin-top: 18px; padding: 14px; background: linear-gradient(135deg, var(--gold), #b8962e); color: white; border: none; border-radius: 30px; font-size: 15px; cursor: pointer; }
  .success { text-align: center; color: #2d6a4f; padding: 15px; background: #d8f3dc; border-radius: 8px; margin-top: 10px; }
  footer { text-align: center; padding: 20px; font-size: 12px; color: #8b7355; background: #fff; }
</style>
</head>
<body>
<div class="invite-container">
  <img src="invitation.jpg" alt="Jessica & Andre Wedding Invitation" class="invitation-img">
  <div class="rsvp-section" id="rsvpSection">
    <h2>RSVP & Check-In</h2>
    <p style="text-align:center; font-size:14px; margin-bottom:15px;">Please confirm your attendance. Maximum 30 guests total.</p>
    <form id="rsvpForm">
      <label>Full Name</label>
      <input type="text" id="guestName" required placeholder="Your full name">
      <label>Number of Guests (including yourself)</label>
      <select id="guestCount"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
      <label>Phone (optional)</label>
      <input type="tel" id="guestPhone" placeholder="Your phone number">
      <button type="submit">Confirm Attendance</button>
    </form>
    <div id="formMessage"></div>
  </div>
  <footer>Jessica & Andre • July 25, 2027 • Sky Beach, Hanover</footer>
</div>
<script>
const MAX_GUESTS = 30;
const STORAGE_KEY = 'jessicaAndreWeddingRSVP';
function loadRSVPs() { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : []; }
function saveRSVPs(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function getTotal() { return loadRSVPs().reduce((s, g) => s + g.count, 0); }
document.getElementById('rsvpForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('guestName').value.trim();
  const count = parseInt(document.getElementById('guestCount').value);
  const phone = document.getElementById('guestPhone').value.trim();
  if (getTotal() + count > MAX_GUESTS) { document.getElementById('formMessage').innerHTML = '<div style="color:#9b2226;text-align:center;margin-top:8px;">Sorry, only ' + (MAX_GUESTS - getTotal()) + ' spots left.</div>'; return; }
  const list = loadRSVPs();
  if (list.some(g => g.name.toLowerCase() === name.toLowerCase())) { document.getElementById('formMessage').innerHTML = '<div style="color:#9b2226;text-align:center;margin-top:8px;">This name has already RSVP\'d.</div>'; return; }
  list.push({ name, count, phone, time: new Date().toISOString() });
  saveRSVPs(list);
  document.getElementById('formMessage').innerHTML = '<div class="success">Thank you, ' + name + '! You are confirmed for ' + count + ' guest' + (count>1?'s':'') + '.<br><br>Your invitation is above.</div>';
  document.getElementById('rsvpForm').reset();
});
</script>
</body>
</html>
